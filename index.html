<!DOCTYPE html>
<html>
<head>
    <title>Cipher Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


        <h2>Encryption/Decryption</h2>


<h3>Choose Cipher:</h3>
<select id="cipherType">
    <option value="caesar">Caesar Cipher</option>
    <option value="hill">Hill Cipher</option>
</select>

<br>

<div id="caesarFields">
    <label for="shiftValue">Shift Value:</label>
    <input type="number" id="shiftValue" placeholder="Enter shift value" min="1" max="25">
</div>

<div id="hillFields" style="display:none; margin-top: 10px;">
    <h4>2x2 Key Matrix:</h4>
    <input type="number" id="key00" placeholder="[0]" min="0" max="25" value="0">
    <input type="number" id="key01" placeholder="[0]" min="0" max="25" value="0"><br>
    <input type="number" id="key10" placeholder="[0]" min="0" max="25" value="0">
    <input type="number" id="key11" placeholder="[0]" min="0" max="25" value="0">
</div>


<h3 id="inputLabel">Plain Text</h3>
<input type="text" id="textInput" placeholder="Enter Text">

<h3 id="resultLabel">Encrypted message</h3>
<div id="DisplayResult"></div>

<br>

<button onclick="encrypt()">Encryption</button>
<button onclick="decrypt()">Decryption</button>
<button onclick="clearAll()">Clear All</button>



<script src="script.js"></script>

</body>
</html>
